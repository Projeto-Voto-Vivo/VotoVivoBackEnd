events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  limit_req_zone  $binary_remote_addr zone=api_por_ip:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conexoes_por_ip:10m;

  server {
    listen 80;
    server_name votovivoleg.com.br www.votovivoleg.com.br;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name votovivoleg.com.br www.votovivoleg.com.br;

    ssl_certificate     /etc/letsencrypt/live/votovivoleg.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votovivoleg.com.br/privkey.pem;

    location /api-docs {
      proxy_pass http://api:3001/api-docs;
      proxy_set_header Host $host;
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      limit_req    zone=api_por_ip burst=20 nodelay;
      limit_req_status 429;
      limit_conn   conexoes_por_ip 20;
      limit_conn_status 429;

      proxy_pass http://api:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

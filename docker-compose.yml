services:
  mysql_db:
    image: mysql:8.0
    container_name: votovivo_db
    environment:
      MYSQL_DATABASE: votovivo
      MYSQL_ROOT_PASSWORD: test
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: votovivo_api
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: mysql://root@mysql_db:3306/votovivo
      PORT: 3001
    depends_on:
      mysql_db:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma generate &&
        node dist/server.js
      "

  frontend:
    build:
      context: ./VotoVivoFrontEnd
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: votovivo_web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://api:3001
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: votovivo_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend

volumes:
  mysql_data:

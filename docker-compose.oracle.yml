services:
  mysql_db:
    image: mysql:8.0
    container_name: votovivo_db
    environment:
      MYSQL_DATABASE: votovivo
      MYSQL_ROOT_PASSWORD: test
    command:
      - --innodb-buffer-pool-size=320M
      - --innodb-log-file-size=64M
      - --innodb-flush-method=O_DIRECT
      - --max-connections=20
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: .
    container_name: votovivo_api
    environment:
      DATABASE_URL: mysql://root:test@mysql_db:3306/votovivo?connection_limit=8&pool_timeout=20
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_JANELA_SEGUNDOS: ${RATE_LIMIT_JANELA_SEGUNDOS:-60}
      CACHE_MAX_AGE: ${CACHE_MAX_AGE:-300}
      CACHE_S_MAXAGE: ${CACHE_S_MAXAGE:-86400}
      CACHE_TTL_SEGUNDOS: ${CACHE_TTL_SEGUNDOS:-60}
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "80:3001"
    depends_on:
      mysql_db:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma generate &&
        node dist/server.js
      "
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  mysql_data:

          nullable: true
        nome:
          type: string
          nullable: true
        tipoOrgao:
          type: string
          nullable: true
        casa:
          type: string
          enum: [Camara, Senado, Congresso]
        cargo:
          type: string
          nullable: true

    VotacaoResumo:
      type: object
      properties:
        id:
          type: integer
        apiId:
          type: string
        orgao:
          $ref: '#/components/schemas/OrgaoRef'
        casa:
          type: string
          enum: [Camara, Senado, Congresso]
        data:
          type: string
          format: date-time
          nullable: true
        resumo:
          type: string
          nullable: true
        resultado:
          type: string
          nullable: true
        tipo:
          type: string
          nullable: true
          enum: [NOMINAL, SIMBOLICA, SECRETA]
        proposicao:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            tipo:
              type: string
              nullable: true
            numero:
              type: string
              nullable: true
            ano:
              type: integer
              nullable: true

    VotacaoDetalhe:
      type: object
      properties:
        id:
          type: integer
        apiId:
          type: string
        casa:
          type: string
        data:
          type: string
          format: date-time
          nullable: true
        resumo:
          type: string
          nullable: true
        resultado:
          type: string
          nullable: true
        tipo:
          type: string
          nullable: true
        orgao:
          $ref: '#/components/schemas/OrgaoRef'
        proposicao:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            tipo:
              type: string
              nullable: true
            numero:
              type: string
              nullable: true
            ano:
              type: integer
              nullable: true
            ementa:
              type: string
              nullable: true
        orientacoes:
          type: array
          description: Orientação de cada bancada. Só a Câmara possui este dado.
          items:
            type: object
            properties:
              bancada:
                type: string
              orientacao:
                type: string
                nullable: true
        placar:
          $ref: '#/components/schemas/Placar'
        totalVotos:
          type: integer
        votos:
          type: object
          description: >
            Ponteiro para a lista nominal, que **não** vem embutida: eram até
            513 objetos por votação. Use `placar` para o agregado.
          properties:
            rota:
              type: string
            observacao:
              type: string

    VotoRegistrado:
      type: object
      properties:
        id:
          type: integer
        parlamentarId:
          type: integer
        parlamentar:
          type: string
          nullable: true
        siglaPartido:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
        voto:
          type: string
          enum:
            - SIM
            - NAO
            - ABSTENCAO
            - OBSTRUCAO
            - AUSENCIA_JUSTIFICADA
            - AUSENTE
            - NAO_REGISTRADO

    ProposicaoDetalhe:
      allOf:
        - $ref: '#/components/schemas/ProposicaoPerfil'
        - type: object
          properties:
            apiId:
              type: string
              description: >
                Id na API de origem — é com ele que o cliente monta o link para
                a ficha oficial da Câmara ou do Senado.
            autores:
              type: array
              items:
                $ref: '#/components/schemas/AutorParlamentar'
            autoria:
              type: object
              description: >
                `autoriaProposicao` só liga proposição a parlamentar. Projeto do
                Executivo, do Judiciário, de comissão ou de iniciativa popular
                fica com `autores` vazio — o que significa "sem autor
                parlamentar", não "sem autor".
              properties:
                somenteParlamentares:
                  type: boolean
                observacao:
                  type: string
            jornada:
              type: object
              description: >
                Relações de `proposicaoRelacao`. `mesmaMateria` liga a mesma
                matéria entre Câmara e Senado, que antes apareciam desconexas.
              properties:
                mesmaMateria:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProposicaoReferencia'
                principal:
                  allOf:
                    - $ref: '#/components/schemas/ProposicaoReferencia'
                  nullable: true
                anteriores:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProposicaoReferencia'
                posteriores:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProposicaoReferencia'
            votacoes:
              type: array
              description: Cada votação já vem com órgão e placar agregado.
              items:
                allOf:
                  - $ref: '#/components/schemas/VotacaoResumo'
                  - type: object
                    properties:
                      orgao:
                        $ref: '#/components/schemas/OrgaoRef'
                      placar:
                        $ref: '#/components/schemas/Placar'
                      totalVotos:
                        type: integer

    ProposicaoReferencia:
      type: object
      properties:
        id:
          type: integer
        casa:
          type: string
          nullable: true
        sigla:
          type: string
          nullable: true
        numero:
          type: string
          nullable: true
        ano:
          type: integer
          nullable: true

    DashboardMetadata:
      type: object
      description: >
        Metodologia do agregado. Toda métrica monetária declara qual valor do
        ciclo orçamentário usou e o que ficou de fora da conta.
      properties:
